<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Auth Service</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Auth Service</h1>
                <p>认证服务管理平台</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="loginTenantId">租户</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🏢</span>
                        <select id="loginTenantId" name="tenantId" class="form-control with-icon" required>
                            <option value="">请选择租户</option>
                        </select>
                    </div>
                </div>

                <!-- 登录方式 Tab（按租户可用方式动态显示） -->
                <div class="login-tabs" id="loginTabs"></div>

                <!-- 账号密码 -->
                <div class="login-pane" id="pane-password" data-method="password">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="loginUsername" class="form-control with-icon"
                                   placeholder="请输入用户名" autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="loginPassword" class="form-control with-icon"
                                   placeholder="请输入密码" autocomplete="current-password">
                        </div>
                    </div>
                </div>

                <!-- 邮箱验证码 -->
                <div class="login-pane" id="pane-email" data-method="email" style="display:none;">
                    <div class="form-group">
                        <label for="emailInput">邮箱</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="email" id="emailInput" class="form-control with-icon"
                                   placeholder="请输入邮箱" autocomplete="email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="emailCode">验证码</label>
                        <div class="code-row">
                            <input type="text" id="emailCode" class="form-control" placeholder="6 位验证码"
                                   maxlength="6" inputmode="numeric">
                            <button type="button" class="btn btn-code" id="sendEmailCodeBtn">获取验证码</button>
                        </div>
                    </div>
                </div>

                <!-- 手机验证码 -->
                <div class="login-pane" id="pane-sms" data-method="sms" style="display:none;">
                    <div class="form-group">
                        <label for="phoneInput">手机号</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📱</span>
                            <input type="tel" id="phoneInput" class="form-control with-icon"
                                   placeholder="请输入手机号" autocomplete="tel">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="phoneCode">验证码</label>
                        <div class="code-row">
                            <input type="text" id="phoneCode" class="form-control" placeholder="6 位验证码"
                                   maxlength="6" inputmode="numeric">
                            <button type="button" class="btn btn-code" id="sendPhoneCodeBtn">获取验证码</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>

            <div class="login-divider" id="loginDivider" style="display:none;"><span>其他登录方式</span></div>
            <div class="social-login" id="socialLoginMethods"></div>

            <div class="login-footer">
                <p>&copy; 2026 Auth Service. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
