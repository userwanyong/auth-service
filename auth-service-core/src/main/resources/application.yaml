server:
  port: 8123

spring:
  application:
    name: auth-service

  # Database Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_service?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.wanyj.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT Configuration
jwt:
  # Secret key for JWT signing (256-bit Base64 encoded)
  # Set via JWT_SECRET in .env file or environment variable
  secret: ${JWT_SECRET:}
  access-token-expiration: 86400000   # 1 day (milliseconds)
  refresh-token-expiration: 604800000 # 7 days (milliseconds)

# Login method credential encryption (AES Base64 key; generate with: openssl rand -base64 32)
# Used to encrypt login_method_config.config_json (email/sms/oauth credentials)
login-config:
  aes-key: ${LOGIN_CONFIG_AES_KEY:}

# Login Rate Limiting
auth:
  rate-limit:
    max-attempts: 5
    window-seconds: 900  # 15 minutes

# Logging Configuration
logging:
  level:
    root: INFO
    cn.wanyj.auth: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.apache.dubbo: INFO
    com.alibaba.nacos: INFO
  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/auth-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# ========== Dubbo Configuration ==========
dubbo:
  application:
    name: auth-service
    version: 1.0.0
    logger: slf4j

  # Protocol configuration
  protocol:
    name: tri              # Triple protocol (Dubbo 3 default, based on HTTP/2)
    port: 20880           # RPC service port
    serialization: protobuf   # Serialization: json / protobuf / hessian

  # Registry configuration (Nacos)
  # Credentials come from .env (local, via spring-dotenv) or environment variables (deployment)
  registry:
    address: ${NACOS_ADDRESS:nacos://localhost:8848}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    parameters:
      namespace:

  # RPC Service Token for inter-service authentication
  rpc:
    service-token: ${RPC_SERVICE_TOKEN:}

  # Service provider configuration
  provider:
    timeout: 5000
    retries: 0
    delay: 0              # Registration delay (seconds)
    version: 1.0.0

  # Metadata report configuration
  metadata-report:
    address: ${NACOS_ADDRESS:nacos://localhost:8848}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}

  # Scan RPC service packages
  scan:
    base-packages: cn.wanyj.auth.rpc

# ========== Aliyun OSS (头像上传；不配置 endpoint 则上传接口返回「OSS 未配置」) ==========
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    object-prefix: ${OSS_OBJECT_PREFIX:avatar}
