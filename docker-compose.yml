# 部署方式：直接把下方 environment 中的 your_* 占位值替换为真实配置即可（仓库中不含任何真实密钥）。
# 容器内环境变量的优先级高于 application.yaml 中的占位符默认值，本地调试则由项目根目录的 .env 提供。
version: '3.8'

services:
  auth-service:
    image: registry.cn-wulanchabu.aliyuncs.com/wanyj/auth-service:5.0
    container_name: auth-service-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/auth_service?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: your_db_password
      # JWT Configuration
      JWT_SECRET: your_jwt_secret
      # Login method credential encryption (AES)
      LOGIN_CONFIG_AES_KEY: your_login_config_aes_key
      # Redis Configuration
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: your_redis_password
      # Nacos Configuration (同时作用于 dubbo registry 和 metadata-report)
      NACOS_ADDRESS: nacos://127.0.0.1:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      # RPC Service Token (for inter-service Dubbo authentication)
      RPC_SERVICE_TOKEN: your_rpc_service_token
      # Aliyun OSS (头像上传；不配置则上传接口不可用)
      OSS_ENDPOINT: your_oss_endpoint
      OSS_BUCKET: your_oss_bucket
      OSS_ACCESS_KEY_ID: your_oss_access_key_id
      OSS_ACCESS_KEY_SECRET: your_oss_access_key_secret
      OSS_OBJECT_PREFIX: avatar
      # JVM Configuration
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+PrintGCDetails
        -XX:+PrintGCTimeStamps
        -Xlog:gc*:file=/logs/gc.log:time,tags:filecount=10,filesize=100M
    ports:
      - "8123:8123"   # REST API
      - "20880:20880" # Dubbo RPC
    volumes:
      - app-logs:/app/logs
    networks:
      - auth-network

# Named volumes for data persistence
volumes:
  app-logs:
    driver: local

# Network for service communication
networks:
  auth-network:
    driver: bridge
